name: Check website and games

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/little-trips/package-lock.json
            apps/letter-tiles/package-lock.json
            apps/switchyard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix apps/little-trips
      - run: npm ci --prefix apps/letter-tiles
      - run: npm ci --prefix apps/switchyard
      - run: npm test --prefix apps/little-trips
      - run: npm test --prefix apps/letter-tiles
      - run: npm test --prefix apps/switchyard
      - run: node scripts/build-site.mjs
      - run: npx playwright install --with-deps chromium webkit
        working-directory: apps/little-trips
      - name: Serve the production build
        run: python3 -m http.server 4180 --bind 127.0.0.1 --directory site-dist > /tmp/site-server.log 2>&1 &
      - run: node scripts/check-action-logs.mjs
      - run: npm run test:browser --prefix apps/little-trips
        env:
          PLAYTEST_URL: http://127.0.0.1:4180/games/little-trips/
      - run: node browser-check.js --hosted http://127.0.0.1:4180/games/peel/
        working-directory: apps/letter-tiles
      - run: npm run test:browser --prefix apps/switchyard
        env:
          PLAYTEST_URL: http://127.0.0.1:4180/games/switchyard/
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: site-dist
