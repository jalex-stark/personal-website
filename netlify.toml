[build]
  base = "."
  command = "npm ci --prefix apps/little-trips && npm ci --prefix apps/letter-tiles && node scripts/build-site.mjs"
  publish = "site-dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/games/letter-tiles"
  to = "/games/peel/"
  status = 301

[[redirects]]
  from = "/games/letter-tiles/*"
  to = "/games/peel/:splat"
  status = 301
