[build]
  base = "."
  command = "npm ci && npm ci --prefix apps/little-trips && npm ci --prefix apps/letter-tiles && npm ci --prefix apps/switchyard && node scripts/build-site.mjs"
  publish = "site-dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/games/letter-tiles"
  to = "/games/peel/"
  status = 301

[[redirects]]
  from = "/games/letter-tiles/*"
  to = "/games/peel/:splat"
  status = 301
